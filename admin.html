<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>DrNotes - لوحة الإدارة</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family:
        Arial,
        Tahoma,
        sans-serif;

      background: #f4f7fb;
      color: #1f2937;
      min-height: 100vh;
    }

    button,
    input,
    textarea,
    select {
      font-family: inherit;
    }

    button {
      cursor: pointer;
    }

    /* =========================
       HEADER
    ========================= */

    header {
      background: #ffffff;
      border-bottom: 1px solid #e5e7eb;
      padding: 15px 20px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
      color: #2563eb;
    }

    .logo span {
      color: #111827;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logout-btn {
      border: none;
      background: #ef4444;
      color: white;
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: bold;
    }

    .logout-btn:hover {
      background: #dc2626;
    }

    /* =========================
       CONTAINER
    ========================= */

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 25px 15px 50px;
    }

    .page-title {
      margin-bottom: 8px;
      font-size: 28px;
    }

    .page-description {
      color: #6b7280;
      margin-bottom: 25px;
    }

    /* =========================
       ALERT
    ========================= */

    #alert {
      display: none;
      padding: 13px 16px;
      border-radius: 10px;
      margin-bottom: 20px;
      font-weight: bold;
    }

    #alert.success {
      display: block;
      background: #dcfce7;
      color: #166534;
      border: 1px solid #bbf7d0;
    }

    #alert.error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }

    #alert.info {
      display: block;
      background: #dbeafe;
      color: #1e40af;
      border: 1px solid #bfdbfe;
    }

    /* =========================
       SECTIONS
    ========================= */

    .section {
      background: white;
      border-radius: 15px;
      padding: 20px;
      margin-bottom: 20px;

      box-shadow:
        0 3px 15px rgba(0, 0, 0, 0.05);
    }

    .section-title {
      font-size: 21px;
      margin-bottom: 15px;
    }

    /* =========================
       SUBJECTS
    ========================= */

    .subjects-grid {
      display: grid;

      grid-template-columns:
        repeat(auto-fit, minmax(180px, 1fr));

      gap: 15px;
    }

    .subject-card {
      border: 2px solid #e5e7eb;
      background: #fff;

      border-radius: 14px;
      padding: 20px 15px;

      text-align: center;

      transition: 0.2s;
    }

    .subject-card:hover {
      border-color: #2563eb;
      transform: translateY(-2px);
    }

    .subject-card.active {
      border-color: #2563eb;
      background: #eff6ff;
    }

    .subject-icon {
      width: 55px;
      height: 55px;

      margin: 0 auto 10px;

      border-radius: 50%;

      background: #dbeafe;
      color: #2563eb;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 25px;
    }

    .subject-name {
      font-weight: bold;
      font-size: 18px;
    }

    /* =========================
       BREADCRUMB
    ========================= */

    .breadcrumb {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;

      align-items: center;

      margin-bottom: 15px;

      color: #6b7280;
    }

    .breadcrumb button {
      border: none;
      background: none;
      color: #2563eb;
      font-weight: bold;
      padding: 0;
    }

    /* =========================
       LISTS
    ========================= */

    .items-grid {
      display: grid;

      grid-template-columns:
        repeat(auto-fit, minmax(220px, 1fr));

      gap: 12px;
    }

    .item-card {
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 15px;
      background: #fff;
    }

    .item-card:hover {
      border-color: #93c5fd;
    }

    .item-name {
      font-size: 17px;
      font-weight: bold;
      margin-bottom: 7px;
    }

    .item-description {
      color: #6b7280;
      font-size: 14px;
      margin-bottom: 12px;
      line-height: 1.6;
    }

    /* =========================
       BUTTONS
    ========================= */

    .btn {
      border: none;
      border-radius: 8px;

      padding: 10px 15px;

      font-weight: bold;
      font-size: 14px;
    }

    .btn-primary {
      background: #2563eb;
      color: white;
    }

    .btn-primary:hover {
      background: #1d4ed8;
    }

    .btn-success {
      background: #16a34a;
      color: white;
    }

    .btn-danger {
      background: #dc2626;
      color: white;
    }

    .btn-secondary {
      background: #e5e7eb;
      color: #111827;
    }

    .btn-small {
      padding: 8px 12px;
      font-size: 13px;
    }

    /* =========================
       FORMS
    ========================= */

    .form-grid {
      display: grid;

      grid-template-columns:
        repeat(auto-fit, minmax(230px, 1fr));

      gap: 15px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group.full {
      grid-column: 1 / -1;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input,
    textarea,
    select {
      width: 100%;

      border: 1px solid #d1d5db;
      border-radius: 8px;

      padding: 11px 12px;

      outline: none;
      background: white;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #2563eb;

      box-shadow:
        0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    /* =========================
       LESSON PANEL
    ========================= */

    .lesson-header {
      background: #eff6ff;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 20px;
    }

    .lesson-header h3 {
      color: #1d4ed8;
      margin-bottom: 5px;
    }

    .content-box {
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 20px;
    }

    .content-box h3 {
      margin-bottom: 15px;
    }

    .form-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    /* =========================
       QUIZ
    ========================= */

    .quiz-info {
      background: #f9fafb;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 15px;
    }

    .question-card {
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 12px;
    }

    .question-text {
      font-weight: bold;
      margin-bottom: 10px;
      line-height: 1.7;
    }

    .question-options {
      color: #4b5563;
      line-height: 1.9;
      font-size: 14px;
    }

    .correct-answer {
      color: #15803d;
      font-weight: bold;
      margin-top: 5px;
    }

    /* =========================
       LOADING
    ========================= */

    .loading {
      text-align: center;
      padding: 30px;
      color: #6b7280;
    }

    .spinner {
      width: 35px;
      height: 35px;

      border: 4px solid #e5e7eb;
      border-top-color: #2563eb;

      border-radius: 50%;

      animation: spin 0.8s linear infinite;

      margin: 0 auto 10px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .empty {
      text-align: center;
      padding: 25px;
      color: #6b7280;
      border: 1px dashed #d1d5db;
      border-radius: 10px;
    }

    /* =========================
       MODAL
    ========================= */

    .modal {
      display: none;

      position: fixed;
      inset: 0;

      background: rgba(0, 0, 0, 0.55);

      z-index: 500;

      padding: 20px;

      overflow-y: auto;
    }

    .modal.show {
      display: flex;
      align-items: flex-start;
      justify-content: center;
    }

    .modal-content {
      background: white;

      width: 100%;
      max-width: 600px;

      border-radius: 15px;

      padding: 20px;

      margin-top: 40px;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;

      margin-bottom: 20px;
    }

    .close-btn {
      border: none;
      background: #f3f4f6;

      width: 35px;
      height: 35px;

      border-radius: 50%;

      font-size: 20px;
    }

    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 600px) {

      header {
        padding: 12px;
      }

      .container {
        padding: 18px 10px 40px;
      }

      .page-title {
        font-size: 23px;
      }

      .section {
        padding: 15px;
      }

      .subjects-grid {
        grid-template-columns:
          repeat(2, 1fr);
      }

      .subject-card {
        padding: 15px 8px;
      }

      .subject-name {
        font-size: 15px;
      }

    }
  </style>
</head>

<body>

  <!-- =====================================================
       HEADER
  ====================================================== -->

  <header>

    <div class="logo">
      Dr<span>Notes</span>
    </div>

    <div class="header-right">

      <button
        class="logout-btn"
        onclick="logout()"
      >
        تسجيل الخروج
      </button>

    </div>

  </header>


  <!-- =====================================================
       MAIN
  ====================================================== -->

  <main class="container">

    <h1 class="page-title">
      لوحة إدارة DrNotes
    </h1>

    <p class="page-description">
      إدارة المواد والوحدات والدروس والمحتوى والاختبارات.
    </p>

    <div id="alert"></div>


    <!-- ===================================================
         SUBJECTS
    ==================================================== -->

    <section class="section">

      <h2 class="section-title">
        📚 المواد الدراسية
      </h2>

      <div
        id="subjectsContainer"
        class="subjects-grid"
      >

        <div class="loading">
          <div class="spinner"></div>
          جاري تحميل المواد...
        </div>

      </div>

    </section>


    <!-- ===================================================
         NAVIGATION
    ==================================================== -->

    <section
      class="section"
      id="navigationSection"
      style="display:none;"
    >

      <div
        id="breadcrumb"
        class="breadcrumb"
      ></div>


      <!-- UNITS -->

      <div id="unitsPanel">

        <h2
          class="section-title"
          id="selectedSubjectTitle"
        >
          الوحدات
        </h2>

        <div
          id="unitsContainer"
          class="items-grid"
        ></div>

        <br>

        <button
          class="btn btn-primary"
          onclick="openAddUnitModal()"
        >
          + إضافة وحدة
        </button>

      </div>


      <!-- LESSONS -->

      <div
        id="lessonsPanel"
        style="display:none;"
      >

        <h2
          class="section-title"
          id="selectedUnitTitle"
        >
          الدروس
        </h2>

        <div
          id="lessonsContainer"
          class="items-grid"
        ></div>

        <br>

        <button
          class="btn btn-primary"
          onclick="openAddLessonModal()"
        >
          + إضافة درس
        </button>

      </div>


      <!-- LESSON MANAGEMENT -->

      <div
        id="lessonPanel"
        style="display:none;"
      >

        <div class="lesson-header">

          <h3 id="selectedLessonTitle">
            الدرس
          </h3>

          <p id="selectedLessonDescription"></p>

        </div>


        <!-- EXPLANATION -->

        <div class="content-box">

          <h3>
            📖 شرح الدرس
          </h3>

          <div class="form-group">

            <label>
              رابط فيديو الشرح
            </label>

            <input
              type="url"
              id="explanationVideo"
              placeholder="https://..."
            >

          </div>


          <div class="form-group">

            <label>
              رابط PDF الشرح
            </label>

            <input
              type="url"
              id="explanationPdf"
              placeholder="https://..."
            >

          </div>


          <div class="form-group">

            <label>
              نص الشرح
            </label>

            <textarea
              id="explanationText"
              placeholder="اكتب شرح الدرس هنا..."
            ></textarea>

          </div>


          <div class="form-actions">

            <button
              class="btn btn-success"
              onclick="saveLessonContent()"
            >
              💾 حفظ شرح الدرس
            </button>

          </div>

        </div>


        <!-- SOLUTION -->

        <div class="content-box">

          <h3>
            📝 حل الدرس
          </h3>

          <div class="form-group">

            <label>
              رابط فيديو الحل
            </label>

            <input
              type="url"
              id="solutionVideo"
              placeholder="https://..."
            >

          </div>


          <div class="form-group">

            <label>
              رابط PDF الحل
            </label>

            <input
              type="url"
              id="solutionPdf"
              placeholder="https://..."
            >

          </div>


          <div class="form-group">

            <label>
              نص الحل
            </label>

            <textarea
              id="solutionText"
              placeholder="اكتب الحل هنا..."
            ></textarea>

          </div>


          <div class="form-actions">

            <button
              class="btn btn-success"
              onclick="saveLessonSolution()"
            >
              💾 حفظ حل الدرس
            </button>

          </div>

        </div>


        <!-- QUIZ -->

        <div class="content-box">

          <h3>
            🧠 اختبار الدرس
          </h3>


          <div class="form-grid">

            <div class="form-group">

              <label>
                اسم الاختبار
              </label>

              <input
                id="quizTitle"
                type="text"
                placeholder="اختبار الدرس"
              >

            </div>


            <div class="form-group">

              <label>
                نسبة النجاح
              </label>

              <input
                id="passingPercentage"
                type="number"
                min="1"
                max="100"
                value="50"
              >

            </div>


            <div class="form-group">

              <label>
                عدد الأسئلة في الصفحة
              </label>

              <input
                id="questionsPerPage"
                type="number"
                min="1"
                value="10"
              >

            </div>


            <div class="form-group full">

              <label>
                وصف الاختبار
              </label>

              <textarea
                id="quizDescription"
                placeholder="وصف الاختبار..."
              ></textarea>

            </div>

          </div>


          <div class="form-actions">

            <button
              class="btn btn-success"
              onclick="saveQuiz()"
            >
              💾 حفظ الاختبار
            </button>

          </div>


          <hr style="margin:20px 0;border:none;border-top:1px solid #e5e7eb;">


          <h3>
            ➕ إضافة سؤال
          </h3>


          <div class="form-group">

            <label>
              السؤال
            </label>

            <textarea
              id="questionText"
              placeholder="اكتب السؤال..."
            ></textarea>

          </div>


          <div class="form-grid">

            <div class="form-group">

              <label>
                الاختيار A
              </label>

              <input
                id="optionA"
                type="text"
              >

            </div>


            <div class="form-group">

              <label>
                الاختيار B
              </label>

              <input
                id="optionB"
                type="text"
              >

            </div>


            <div class="form-group">

              <label>
                الاختيار C
              </label>

              <input
                id="optionC"
                type="text"
              >

            </div>


            <div class="form-group">

              <label>
                الاختيار D
              </label>

              <input
                id="optionD"
                type="text"
              >

            </div>


            <div class="form-group">

              <label>
                الإجابة الصحيحة
              </label>

              <select id="correctAnswer">

                <option value="A">A</option>
                <option value="B">B</option>
                <option value="C">C</option>
                <option value="D">D</option>

              </select>

            </div>


            <div class="form-group">

              <label>
                ترتيب السؤال
              </label>

              <input
                id="questionOrder"
                type="number"
                value="0"
              >

            </div>


            <div class="form-group full">

              <label>
                شرح الإجابة
              </label>

              <textarea
                id="questionExplanation"
                placeholder="شرح يظهر للطالب بعد الاختبار..."
              ></textarea>

            </div>

          </div>


          <div class="form-actions">

            <button
              class="btn btn-primary"
              onclick="addQuestion()"
            >
              ➕ إضافة السؤال
            </button>

          </div>


          <br>


          <h3>
            الأسئلة الموجودة
          </h3>

          <div
            id="questionsContainer"
          ></div>

        </div>

      </div>

    </section>

  </main>


  <!-- =====================================================
       ADD UNIT MODAL
  ====================================================== -->

  <div
    class="modal"
    id="unitModal"
  >

    <div class="modal-content">

      <div class="modal-header">

        <h2>
          إضافة وحدة
        </h2>

        <button
          class="close-btn"
          onclick="closeModal('unitModal')"
        >
          ×
        </button>

      </div>


      <div class="form-group">

        <label>
          اسم الوحدة
        </label>

        <input
          id="unitName"
          type="text"
          placeholder="مثال: الوحدة الأولى"
        >

      </div>


      <div class="form-group">

        <label>
          وصف الوحدة
        </label>

        <textarea
          id="unitDescription"
        ></textarea>

      </div>


      <div class="form-group">

        <label>
          ترتيب الوحدة
        </label>

        <input
          id="unitOrder"
          type="number"
          value="0"
        >

      </div>


      <button
        class="btn btn-primary"
        onclick="addUnit()"
      >
        حفظ الوحدة
      </button>

    </div>

  </div>


  <!-- =====================================================
       ADD LESSON MODAL
  ====================================================== -->

  <div
    class="modal"
    id="lessonModal"
  >

    <div class="modal-content">

      <div class="modal-header">

        <h2>
          إضافة درس
        </h2>

        <button
          class="close-btn"
          onclick="closeModal('lessonModal')"
        >
          ×
        </button>

      </div>


      <div class="form-group">

        <label>
          اسم الدرس
        </label>

        <input
          id="lessonName"
          type="text"
          placeholder="مثال: مقدمة في الفيزياء"
        >

      </div>


      <div class="form-group">

        <label>
          وصف الدرس
        </label>

        <textarea
          id="lessonDescription"
        ></textarea>

      </div>


      <div class="form-group">

        <label>
          ترتيب الدرس
        </label>

        <input
          id="lessonOrder"
          type="number"
          value="0"
        >

      </div>


      <button
        class="btn btn-primary"
        onclick="addLesson()"
      >
        حفظ الدرس
      </button>

    </div>

  </div>


  <script>

    // =====================================================
    // API
    // =====================================================

    const API =
      window.location.origin + "/api";


    // =====================================================
    // STATE
    // =====================================================

    let adminToken =
      localStorage.getItem("adminToken");

    let subjects = [];

    let selectedSubject = null;

    let selectedUnit = null;

    let selectedLesson = null;

    let currentQuiz = null;


    // =====================================================
    // REQUIRED SUBJECTS
    // =====================================================

    const requiredSubjects = [

      {
        name: "الفيزياء",
        description: "مادة الفيزياء"
      },

      {
        name: "الكيمياء",
        description: "مادة الكيمياء"
      },

      {
        name: "الأحياء",
        description: "مادة الأحياء"
      },

      {
        name: "العربي",
        description: "مادة اللغة العربية"
      },

      {
        name: "الإنجليزي",
        description: "مادة اللغة الإنجليزية"
      },

      {
        name: "الحاسوب",
        description: "مادة الحاسوب"
      }

    ];


    // =====================================================
    // INIT
    // =====================================================

    document.addEventListener(
      "DOMContentLoaded",
      async () => {

        if (!adminToken) {

          alert(
            "يجب تسجيل دخول المدير أولاً."
          );

          window.location.href =
            "admin-login.html";

          return;

        }

        await loadSubjects();

      }
    );


    // =====================================================
    // API REQUEST
    // =====================================================

    async function api(
      endpoint,
      options = {}
    ) {

      const headers = {
        "Content-Type": "application/json",
        ...(options.headers || {})
      };


      if (adminToken) {

        headers.Authorization =
          `Bearer ${adminToken}`;

      }


      const response =
        await fetch(
          API + endpoint,
          {
            ...options,
            headers
          }
        );


      let data = {};

      try {

        data =
          await response.json();

      } catch (_) {

        data = {};

      }


      if (
        response.status === 401 ||
        response.status === 403
      ) {

        localStorage.removeItem(
          "adminToken"
        );

        alert(
          "انتهت جلسة المدير. سجل الدخول مرة أخرى."
        );

        window.location.href =
          "admin-login.html";

        throw new Error(
          "Unauthorized"
        );

      }


      if (!response.ok) {

        throw new Error(
          data.message ||
          "حدث خطأ في الخادم."
        );

      }


      return data;

    }


    // =====================================================
    // ALERT
    // =====================================================

    function showAlert(
      message,
      type = "success"
    ) {

    // =====================================================
    // LOAD SUBJECTS
    // =====================================================

    async function loadSubjects() {

      const container =
        document.getElementById(
          "subjectsContainer"
        );

      container.innerHTML = `
        <div class="loading">
          <div class="spinner"></div>
          جاري تحميل المواد...
        </div>
      `;


      try {

        const data =
          await api(
            "/subjects",
            {
              headers: {}
            }
          );


        subjects =
          data.subjects || [];


        // -------------------------------------------------
        // إنشاء المواد الستة الناقصة تلقائيًا
        // -------------------------------------------------

        for (
          const required of requiredSubjects
        ) {

          const exists =
            subjects.some(
              subject =>
                subject.name.trim() ===
                required.name
            );


          if (!exists) {

            try {

              const created =
                await api(
                  "/admin/subjects",
                  {
                    method: "POST",

                    body:
                      JSON.stringify(
                        {
                          name:
                            required.name,

                          description:
                            required.description,

                          image_url:
                            null
                        }
                      )
                  }
                );


              if (
                created.subject
              ) {

                subjects.push(
                  created.subject
                );

              }

            } catch (error) {

              console.error(
                "Subject creation error:",
                required.name,
                error
              );

            }

          }

        }


        // -------------------------------------------------
        // ترتيب المواد الستة
        // -------------------------------------------------

        subjects =
          sortRequiredSubjects(
            subjects
          );


        renderSubjects();


      } catch (error) {

        console.error(error);

        container.innerHTML = `
          <div class="empty">
            تعذر تحميل المواد.<br><br>
            ${escapeHtml(error.message)}
          </div>
        `;

      }

    }


    // =====================================================
    // SORT SUBJECTS
    // =====================================================

    function sortRequiredSubjects(
      list
    ) {

      return [
        ...requiredSubjects
          .map(required =>
            list.find(
              subject =>
                subject.name.trim() ===
                required.name
            )
          )
          .filter(Boolean),

        ...list.filter(
          subject =>
            !requiredSubjects.some(
              required =>
                required.name ===
                subject.name.trim()
            )
        )

      ];

    }


    // =====================================================
    // SUBJECT ICON
    // =====================================================

    function getSubjectIcon(
      name
    ) {

      const icons = {

        "الفيزياء": "⚡",

        "الكيمياء": "🧪",

        "الأحياء": "🧬",

        "العربي": "📖",

        "الإنجليزي": "🔤",

        "الحاسوب": "💻"

      };

      return icons[name] || "📚";

    }


    // =====================================================
    // RENDER SUBJECTS

    function renderSubjects() {

      const container =
        document.getElementById(

      if (!subjects.length) {

        container.innerHTML = `

      container.innerHTML =
        subjects

              class="subject-card ${
                selectedSubject &&
                selectedSubject.id === subject.id
                  ? "active"
                  : ""

        html += `
          <span>›</span>

          <span>
            ${escapeHtml(
              selectedLesson.name
            )}
          </span>
        `;

      }


      breadcrumb.innerHTML =
        html;

    }


    // =====================================================
    // GO TO SUBJECTS
    // =====================================================

    function goToSubjects() {

      selectedSubject = null;
      selectedUnit = null;
      selectedLesson = null;


      document.getElementById(
        "navigationSection"
      ).style.display = "none";


      renderSubjects();

    }


    // =====================================================
    // GO TO SUBJECT
    // =====================================================

    async function goToSubject() {

      if (!selectedSubject) {
        return;
      }


      selectedUnit = null;
      selectedLesson = null;


      document.getElementById(
        "lessonsPanel"
      ).style.display = "none";


      document.getElementById(
        "lessonPanel"
      ).style.display = "none";


      updateBreadcrumb();


      await loadUnits();

    }


    // =====================================================
    // GO TO UNIT
    // =====================================================

    async function goToUnit() {

      if (!selectedUnit) {
        return;
      }


      selectedLesson = null;


      document.getElementById(
        "lessonPanel"
      ).style.display = "none";


      updateBreadcrumb();


      await loadLessons();

    }


    // =====================================================
    // LOGOUT
    // =====================================================

    function logout() {

      localStorage.removeItem(
        "adminToken"
      );

      window.location.href =
        "admin-login.html";

    }


    // =====================================================
    // ESCAPE HTML
    // =====================================================

    function escapeHtml(
      value
    ) {

      if (
        value === null ||
        value === undefined
      ) {

        return "";

      }


      return String(value)
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );

    }

  </script>
