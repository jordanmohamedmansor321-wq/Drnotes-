<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>DrNotes - لوحة الإدارة</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Tahoma, sans-serif;
      background: #f4f7fb;
      color: #172033;
      min-height: 100vh;
    }

    button,
    input,
    textarea,
    select {
      font-family: inherit;
    }

    button {
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    #loginScreen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: linear-gradient(135deg, #0f766e, #0f172a);
    }

    .login-card {
      width: 100%;
      max-width: 430px;
      background: white;
      border-radius: 22px;
      padding: 32px;
      box-shadow: 0 20px 60px rgba(0,0,0,.25);
    }

    .logo {
      text-align: center;
      font-size: 34px;
      font-weight: 900;
      color: #0f766e;
      margin-bottom: 8px;
    }

    .login-subtitle {
      text-align: center;
      color: #64748b;
      margin-bottom: 28px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
    }

    .form-control {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #d8dee8;
      border-radius: 11px;
      outline: none;
      font-size: 15px;
      background: #fff;
    }

    .form-control:focus {
      border-color: #0f766e;
      box-shadow: 0 0 0 3px rgba(15,118,110,.1);
    }

    .btn {
      border: none;
      border-radius: 11px;
      padding: 12px 18px;
      font-size: 15px;
      font-weight: bold;
      transition: .2s;
    }

    .btn:hover {
      transform: translateY(-1px);
    }

    .btn-primary {
      background: #0f766e;
      color: white;
    }

    .btn-primary:hover {
      background: #0b5f59;
    }

    .btn-danger {
      background: #dc2626;
      color: white;
    }

    .btn-warning {
      background: #d97706;
      color: white;
    }

    .btn-secondary {
      background: #64748b;
      color: white;
    }

    .btn-light {
      background: #e8eef5;
      color: #172033;
    }

    .btn-success {
      background: #15803d;
      color: white;
    }

    .full {
      width: 100%;
    }

    .error-message,
    .success-message {
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 15px;
      display: none;
      line-height: 1.6;
    }

    .error-message {
      background: #fee2e2;
      color: #991b1b;
    }

    .success-message {
      background: #dcfce7;
      color: #166534;
    }

    #adminScreen {
      min-height: 100vh;
    }

    .topbar {
      height: 70px;
      background: #0f172a;
      color: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .topbar-title {
      font-size: 22px;
      font-weight: 900;
    }

    .topbar-actions {
      display: flex;
      gap: 10px;
    }

    .admin-layout {
      display: grid;
      grid-template-columns: 280px 1fr;
      min-height: calc(100vh - 70px);
    }

    .sidebar {
      background: white;
      border-left: 1px solid #e2e8f0;
      padding: 20px;
    }

    .sidebar-title {
      font-size: 18px;
      font-weight: 900;
      margin-bottom: 15px;
    }

    .subject-list {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .subject-item {
      width: 100%;
      text-align: right;
      border: 1px solid #e2e8f0;
      background: #f8fafc;
      border-radius: 12px;
      padding: 13px;
      font-weight: bold;
      transition: .2s;
    }

    .subject-item:hover {
      border-color: #0f766e;
    }

    .subject-item.active {
      background: #0f766e;
      color: white;
      border-color: #0f766e;
    }

    .main-content {
      padding: 25px;
      min-width: 0;
    }

    .page-header {
      margin-bottom: 22px;
    }

    .page-header h1 {
      font-size: 28px;
      margin-bottom: 7px;
    }

    .page-header p {
      color: #64748b;
    }

    .breadcrumb {
      margin-bottom: 20px;
      color: #64748b;
      font-size: 14px;
    }

    .breadcrumb span {
      color: #0f766e;
      font-weight: bold;
    }

    .card {
      background: white;
      border-radius: 17px;
      padding: 20px;
      box-shadow: 0 4px 20px rgba(15,23,42,.06);
      border: 1px solid #e8edf4;
      margin-bottom: 20px;
    }

    .card-title {
      font-size: 19px;
      font-weight: 900;
      margin-bottom: 15px;
    }

    .empty {
      padding: 35px 20px;
      text-align: center;
      color: #64748b;
      background: #f8fafc;
      border-radius: 14px;
    }

    .grid {
      display: grid;
      gap: 15px;
    }

    .grid-2 {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .grid-3 {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .item-card {
      border: 1px solid #e2e8f0;
      background: #fff;
      border-radius: 14px;
      padding: 17px;
      transition: .2s;
    }

    .item-card:hover {
      border-color: #0f766e;
      box-shadow: 0 5px 18px rgba(15,118,110,.08);
    }

    .item-title {
      font-size: 17px;
      font-weight: 900;
      margin-bottom: 8px;
    }

    .item-description {
      color: #64748b;
      line-height: 1.6;
      font-size: 14px;
      margin-bottom: 12px;
    }

    .item-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    textarea.form-control {
      min-height: 130px;
      resize: vertical;
    }

    .form-row {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .form-row-3 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }

    .section-label {
      font-weight: 900;
      margin-bottom: 12px;
      display: block;
      font-size: 16px;
    }

    .divider {
      height: 1px;
      background: #e2e8f0;
      margin: 25px 0;
    }

    .lesson-header {
      background: #f0fdfa;
      border: 1px solid #ccfbf1;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 20px;
    }

    .lesson-header h2 {
      color: #115e59;
      margin-bottom: 6px;
    }

    .content-section {
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 18px;
    }

    .content-section h3 {
      margin-bottom: 15px;
    }

    .content-section.explanation {
      border-right: 4px solid #0f766e;
    }

    .content-section.solution {
      border-right: 4px solid #d97706;
    }

    .content-section.quiz {
      border-right: 4px solid #2563eb;
    }

    .content-section.edit-lesson {
      border-right: 4px solid #7c3aed;
      background: #faf5ff;
    }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 15px;
    }

    .question-card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 13px;
      padding: 15px;
      margin-bottom: 12px;
    }

    .question-number {
      font-weight: 900;
      color: #0f766e;
      margin-bottom: 8px;
    }

    .question-options {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin: 10px 0;
    }

    .option-box {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 9px;
      font-size: 14px;
    }

    .correct-option {
      border-color: #16a34a;
      background: #f0fdf4;
    }

    .table-wrapper {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 650px;
    }

    th,
    td {
      padding: 12px;
      border-bottom: 1px solid #e2e8f0;
      text-align: right;
    }

    th {
      background: #f8fafc;
      font-weight: 900;
    }

    .loading {
      padding: 30px;
      text-align: center;
      color: #64748b;
    }

    .spinner {
      width: 30px;
      height: 30px;
      border: 3px solid #dbe5e5;
      border-top-color: #0f766e;
      border-radius: 50%;
      animation: spin .8s linear infinite;
      margin: 0 auto 10px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (max-width: 900px) {

      .admin-layout {
        grid-template-columns: 1fr;
      }

      .sidebar {
        border-left: none;
        border-bottom: 1px solid #e2e8f0;
      }

      .subject-list {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
      }

      .grid-3 {
        grid-template-columns: repeat(2, 1fr);
      }

    }

    @media (max-width: 650px) {

      .topbar {
        padding: 0 12px;
      }

      .topbar-title {
        font-size: 17px;
      }

      .main-content {
        padding: 15px;
      }

      .subject-list {
        grid-template-columns: repeat(2, 1fr);
      }

      .grid-2,
      .grid-3,
      .form-row,
      .form-row-3 {
        grid-template-columns: 1fr;
      }

      .question-options {
        grid-template-columns: 1fr;
      }

      .login-card {
        padding: 22px;
      }

    }
  </style>
</head>

<body>

<section id="loginScreen">

  <div class="login-card">

    <div class="logo">
      DrNotes
    </div>

    <div class="login-subtitle">
      لوحة إدارة المنصة
    </div>

    <div
      id="loginError"
      class="error-message"
    ></div>

    <form id="loginForm">

      <div class="form-group">

        <label>
          البريد الإلكتروني
        </label>

        <input
          id="adminEmail"
          class="form-control"
          type="email"
          placeholder="أدخل بريد المدير"
          required
        >

      </div>

      <div class="form-group">

        <label>
          كلمة المرور
        </label>

        <input
          id="adminPassword"
          class="form-control"
          type="password"
          placeholder="أدخل كلمة المرور"
          required
        >

      </div>

      <button
        class="btn btn-primary full"
        type="submit"
      >
        تسجيل دخول المدير
      </button>

    </form>

  </div>

</section>


<section
  id="adminScreen"
  class="hidden"
>

  <header class="topbar">

    <div class="topbar-title">
      DrNotes - لوحة الإدارة
    </div>

    <div class="topbar-actions">

      <button
        class="btn btn-light"
        onclick="showUsers()"
      >
        المستخدمون
      </button>

      <button
        class="btn btn-danger"
        onclick="logout()"
      >
        تسجيل الخروج
      </button>

    </div>

  </header>


  <div class="admin-layout">

    <aside class="sidebar">

      <div class="sidebar-title">
        المواد الدراسية
      </div>

      <div
        id="subjectsList"
        class="subject-list"
      >

        <div class="loading">
          <div class="spinner"></div>
          جاري تحميل المواد...
        </div>

      </div>

    </aside>


    <main class="main-content">

      <div class="page-header">

        <h1 id="pageTitle">
          لوحة الإدارة
        </h1>

        <p id="pageSubtitle">
          اختر مادة من القائمة للبدء.
        </p>

      </div>

      <div
        id="breadcrumb"
        class="breadcrumb"
      >
        الرئيسية
      </div>

      <div
        id="successMessage"
        class="success-message"
      ></div>

      <div
        id="errorMessage"
        class="error-message"
      ></div>

      <div id="contentArea">

        <div class="card">

          <div class="card-title">
            مرحبًا بك في لوحة إدارة DrNotes
          </div>

          <div class="empty">

            اختر واحدة من المواد الست الموجودة
            في منصة الطالب:

            <br><br>

            <strong>
              الفيزياء - الكيمياء - الأحياء -
              العربي - الإنجليزي - الحاسوب
            </strong>

          </div>

        </div>

      </div>

    </main>

  </div>

</section>


<script>

  /* =====================================================
     CONFIG
  ===================================================== */

  const API_BASE = window.location.origin;

  const SUBJECT_NAMES = [
    "الفيزياء",
    "الكيمياء",
    "الأحياء",
    "العربي",
    "الإنجليزي",
    "الحاسوب"
  ];


  /* =====================================================
     STATE
  ===================================================== */

  let adminToken =
    localStorage.getItem("drnotes_admin_token") || "";

  let subjects = [];

  let currentSubject = null;

  let currentUnit = null;

  let currentLesson = null;

  let currentQuiz = null;


  /* =====================================================
     HELPERS
  ===================================================== */

  function escapeHtml(value) {

    if (value === null || value === undefined) {
      return "";
    }

    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

  }


  function showError(message) {

    const box =
      document.getElementById("errorMessage");

    box.textContent = message;

    box.style.display = "block";

    setTimeout(() => {
      box.style.display = "none";
    }, 5000);

  }


  function showSuccess(message) {

    const box =
      document.getElementById("successMessage");

    box.textContent = message;

    box.style.display = "block";

    setTimeout(() => {
      box.style.display = "none";
    }, 4000);

  }


  async function api(
    url,
    options = {}
  ) {

    const headers = {
      ...(options.headers || {})
    };

    if (
      options.body &&
      !headers["Content-Type"]
    ) {

      headers["Content-Type"] =
        "application/json";

    }

    if (adminToken) {

      headers["Authorization"] =
        "Bearer " + adminToken;

    }

    const response =
      await fetch(
        API_BASE + url,
        {
          ...options,
          headers
        }
      );

    let data = null;

    try {
      data = await response.json();
    } catch (_) {
      data = {};
    }

    if (
      response.status === 401 &&
      adminToken
    ) {

      logout();

      throw new Error(
        "انتهت جلسة المدير، يرجى تسجيل الدخول مرة أخرى."
      );

    }

    if (!response.ok) {

      throw new Error(
        data.message ||
        "حدث خطأ في الاتصال بالخادم."
      );

    }

    return data;

  }


  /* =====================================================
     LOGIN
  ===================================================== */

  document
    .getElementById("loginForm")
    .addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();

        const email =
          document
            .getElementById("adminEmail")
            .value
            .trim();

        const password =
          document
            .getElementById("adminPassword")
            .value;

        const errorBox =
          document
            .getElementById("loginError");

        errorBox.style.display = "none";

        try {

          const response =
            await fetch(
              API_BASE +
              "/api/admin/login",
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                body:
                  JSON.stringify({
                    email,
                    password
                  })
              }
            );

          const data =
            await response.json();

          if (!response.ok) {

            throw new Error(
              data.message ||
              "بيانات تسجيل الدخول غير صحيحة."
            );

          }

          adminToken =
            data.token;

          localStorage.setItem(
            "drnotes_admin_token",
            adminToken
          );

          showAdminScreen();

        } catch (error) {

          errorBox.textContent =
            error.message;

          errorBox.style.display =
            "block";

        }

      }
    );


  /* =====================================================
     SHOW ADMIN
  ===================================================== */

  function showAdminScreen() {

    document
      .getElementById("loginScreen")
      .classList
      .add("hidden");

    document
      .getElementById("adminScreen")
      .classList
      .remove("hidden");

    loadSubjects();

  }


  /* =====================================================
     LOGOUT
  ===================================================== */

  function logout() {

    localStorage.removeItem(
      "drnotes_admin_token"
    );

    adminToken = "";

    location.reload();

  }


  /* =====================================================
     LOAD SUBJECTS
  ===================================================== */

  async function loadSubjects() {

    const list =
      document.getElementById(
        "subjectsList"
      );

    list.innerHTML = `
      <div class="loading">
        <div class="spinner"></div>
        جاري تحميل المواد...
      </div>
    `;

    try {

      const data =
        await api(
          "/api/subjects"
        );

      let rawSubjects =
        Array.isArray(data.subjects)
          ? data.subjects
          : [];


      /*
       * منع ظهور نفس المادة أكثر من مرة
       * داخل لوحة الإدارة.
       *
       * لا ننشئ نسخة ثانية من المادة
       * إذا كانت موجودة.
       */

      const uniqueSubjects = [];

      const seenNames =
        new Set();

      rawSubjects.forEach(subject => {

        const normalized =
          String(subject.name || "")
            .trim()
            .toLowerCase();

        if (!normalized) {
          return;
        }

        if (seenNames.has(normalized)) {
          return;
        }

        seenNames.add(normalized);

        uniqueSubjects.push(subject);

      });


      /*
       * إنشاء المواد الناقصة فقط.
       */

      for (
        const subjectName
        of SUBJECT_NAMES
      ) {

        const exists =
          uniqueSubjects.some(
            subject =>
              String(subject.name || "")
                .trim()
                .toLowerCase() ===
              subjectName
                .trim()
                .toLowerCase()
          );

        if (!exists) {

          try {

            await api(
              "/api/admin/subjects",
              {
                method: "POST",

                body:
                  JSON.stringify({
                    name:
                      subjectName,
                    description:
                      "مادة دراسية في منصة DrNotes"
                  })
              }
            );

          } catch (error) {

            console.error(
              "Create default subject error:",
              error
            );

          }

        }

      }


      const refreshed =
        await api(
          "/api/subjects"
        );

      rawSubjects =
        Array.isArray(
          refreshed.subjects
        )
          ? refreshed.subjects
          : [];


      /*
       * إزالة التكرار من العرض.
       */

      subjects = [];

      const finalSeen =
        new Set();

      rawSubjects.forEach(subject => {

        const normalized =
          String(subject.name || "")
            .trim()
            .toLowerCase();

        if (
          normalized &&
          !finalSeen.has(normalized)
        ) {

          finalSeen.add(normalized);

          subjects.push(subject);

        }

      });


      /*
       * ترتيب المواد.
       */

      subjects.sort(
        (a, b) => {

          const ai =
            SUBJECT_NAMES.indexOf(
              String(a.name || "").trim()
            );

          const bi =
            SUBJECT_NAMES.indexOf(
              String(b.name || "").trim()
            );

          return (
            (ai === -1 ? 999 : ai) -
            (bi === -1 ? 999 : bi)
          );

        }
      );

      renderSubjects();

    } catch (error) {

      list.innerHTML = `
        <div class="empty">
          تعذر تحميل المواد.
          <br><br>
          ${escapeHtml(error.message)}
        </div>
      `;

    }

  }


  /* =====================================================
     RENDER SUBJECTS
  ===================================================== */

  function renderSubjects() {

    const list =
      document.getElementById(
        "subjectsList"
      );

    if (!subjects.length) {

      list.innerHTML = `
        <div class="empty">
          لا توجد مواد.
        </div>
      `;

      return;

    }

    list.innerHTML =
      subjects
        .map(subject => {

          const active =
            currentSubject &&
            currentSubject.id === subject.id
              ? "active"
              : "";

          return `
            <button
              class="subject-item ${active}"
              onclick="selectSubject(${subject.id})"
            >
              ${escapeHtml(subject.name)}
            </button>
          `;

        })
        .join("");

  }


  /* =====================================================
     SELECT SUBJECT
  ===================================================== */

  async function selectSubject(
    subjectId
  ) {

    currentSubject =
      subjects.find(
        subject =>
          subject.id === subjectId
      ) || null;

    currentUnit = null;
    currentLesson = null;
    currentQuiz = null;

    renderSubjects();

    if (!currentSubject) {
      return;
    }

    document
      .getElementById("pageTitle")
      .textContent =
        currentSubject.name;

    document
      .getElementById("pageSubtitle")
      .textContent =
        "الوحدات والدروس الموجودة داخل المادة.";

    document
      .getElementById("breadcrumb")
      .innerHTML =
        `الرئيسية ← <span>${escapeHtml(
          currentSubject.name
        )}</span>`;

    await loadUnits(
      currentSubject.id
    );

  }


  /* =====================================================
     LOAD UNITS
  ===================================================== */

  async function loadUnits(
    subjectId
  ) {

    const area =
      document.getElementById(
        "contentArea"
      );

    area.innerHTML = `
      <div class="card">
        <div class="loading">
          <div class="spinner"></div>
          جاري تحميل الوحدات...
        </div>
      </div>
    `;

    try {

      const data =

  async function deleteLesson(
    lessonId
  ) {

    const confirmed =
      confirm(
        "⚠️ هل أنت متأكد من حذف هذا الدرس؟\n\nسيتم حذف الدرس ومحتواه المرتبط به مثل الشرح والحل والاختبار والأسئلة. لا يمكن التراجع عن هذه العملية."
      );

    if (!confirmed) {
      return;
    }

    const secondConfirmed =
      confirm(
        "تأكيد نهائي: حذف الدرس نهائيًا؟"
      );

    if (!secondConfirmed) {
      return;
    }

    try {

      await api(
        `/api/admin/lessons/${lessonId}`,
        {
          method: "DELETE"
        }
      );

      showSuccess(
        "تم حذف الدرس وجميع بياناته المرتبطة بنجاح."
      );

      await loadLessons(
        currentUnit.id
      );

    } catch (error) {

      showError(
        error.message
      );

    }

  }

          .trim();

      const explanation =
        document
          .getElementById("solutionText")
          .value;

      await api(
        `/api/admin/lessons/${currentLesson.id}/solution`,
        {
          method: "POST",

          body:
            JSON.stringify({
              video_url:
                video || null,
              pdf_url:
                pdf || null,
              explanation:
                explanation || null
            })
        }
      );

      showSuccess(
        "تم حفظ حل الدرس بنجاح."
      );

    } catch (error) {

      showError(
        error.message
      );

    }

  }


  /* =====================================================
     SAVE QUIZ
  ===================================================== */

  async function saveQuiz() {

    try {

      const title =
        document
          .getElementById("quizTitle")
          .value
          .trim();

      const description =
        document
          .getElementById("quizDescription")
          .value
          .trim();

      const passing =
        Number(
          document
            .getElementById("quizPassing")
            .value
        ) || 50;

      const perPage =
        Number(
          document
            .getElementById("quizQuestionsPerPage")
            .value
        ) || 10;

      if (!title) {

        showError(
          "اكتب اسم الاختبار."
        );

        return;

      }

      const data =
        await api(
          "/api/admin/quizzes",
          {
            method: "POST",

            body:
              JSON.stringify({

                lesson_id:
                  currentLesson.id,

                title,

                description,

                passing_percentage:
                  passing,

                questions_per_page:
                  perPage

              })
          }
        );

      currentQuiz =
        data.quiz;

      showSuccess(
        "تم حفظ الاختبار بنجاح."
      );

      await loadQuizManagement();

    } catch (error) {

      showError(
        error.message
      );

    }

  }


  /* =====================================================
     LOAD QUIZ MANAGEMENT
  ===================================================== */

  async function loadQuizManagement() {

    const container =
      document.getElementById(
        "quizManagement"
      );

    if (!container) {
      return;
    }

    if (!currentQuiz) {

      container.innerHTML = `
        <div class="empty">
          احفظ الاختبار أولًا حتى تستطيع إضافة الأسئلة.
        </div>
      `;

      return;

    }

    try {

      const data =
        await api(
          `/api/admin/quizzes/${currentQuiz.id}/questions`
        );

      const questions =
        Array.isArray(data.questions)
          ? data.questions
          : [];

      let html = `

        <div class="divider"></div>

        <h3>
          أسئلة الاختبار
        </h3>

      `;

      if (!questions.length) {

        html += `
          <div class="empty">
            لا توجد أسئلة حتى الآن.
          </div>
        `;

      } else {

        html += `<div>`;

        questions.forEach(
          (question, index) => {

            html += `
              <div class="question-card">

                <div class="question-number">
                  السؤال ${index + 1}
                </div>

                <div style="line-height:1.7;">
                  ${escapeHtml(
                    question.question_text
                  )}
                </div>

                <div class="question-options">

                  <div class="option-box ${
                    question.correct_answer === "A"
                      ? "correct-option"
                      : ""
                  }">
                    A:
                    ${escapeHtml(
                      question.option_a
                    )}
                  </div>

                  <div class="option-box ${
                    question.correct_answer === "B"
                      ? "correct-option"
                      : ""
                  }">
                    B:
                    ${escapeHtml(
                      question.option_b
                    )}
                  </div>

                  <div class="option-box ${
                    question.correct_answer === "C"
                      ? "correct-option"
                      : ""
                  }">
                    C:
                    ${escapeHtml(
                      question.option_c
                    )}
                  </div>

                  <div class="option-box ${
                    question.correct_answer === "D"
                      ? "correct-option"
                      : ""
                  }">
                    D:
                    ${escapeHtml(
                      question.option_d
                    )}
                  </div>

                </div>

                <div style="margin:10px 0;font-size:14px;">
                  الإجابة الصحيحة:
                  <strong>
                    ${escapeHtml(
                      question.correct_answer
                    )}
                  </strong>
                </div>

                <button
                  class="btn btn-danger"
                  onclick="deleteQuestion(${question.id})"
                >
                  حذف السؤال
                </button>

              </div>
            `;

          }
        );

        html += `</div>`;

      }

      html += `

        <div class="divider"></div>

        <button
          class="btn btn-success"
          onclick="showAddQuestionForm()"
        >
          + إضافة سؤال
        </button>

        <div
          id="addQuestionContainer"
          class="hidden"
        ></div>

      `;

      container.innerHTML =
        html;

    } catch (error) {

      container.innerHTML = `
        <div class="empty">
          تعذر تحميل الأسئلة.
          <br><br>
          ${escapeHtml(
            error.message
          )}
        </div>
      `;

    }

  }


  /* =====================================================
     ADD QUESTION FORM
  ===================================================== */

  function showAddQuestionForm() {

    const container =
      document.getElementById(
        "addQuestionContainer"
      );

    container.classList.remove(
      "hidden"
    );

    container.innerHTML = `

      <div class="content-section">

        <h3>
          إضافة سؤال جديد
        </h3>

        <div class="form-group">

          <label>
            نص السؤال
          </label>

          <textarea
            id="questionText"
            class="form-control"
            placeholder="اكتب السؤال هنا..."
          ></textarea>

        </div>

        <div class="form-row">

          <div class="form-group">

            <label>
              الاختيار A
            </label>

            <input
              id="optionA"
              class="form-control"
            >

          </div>

          <div class="form-group">

            <label>
              الاختيار B
            </label>

            <input
              id="optionB"
              class="form-control"
            >

          </div>

        </div>

        <div class="form-row">

          <div class="form-group">

            <label>
              الاختيار C
            </label>

            <input
              id="optionC"
              class="form-control"
            >

          </div>

          <div class="form-group">

            <label>
              الاختيار D
            </label>

            <input
              id="optionD"
              class="form-control"
            >

          </div>

        </div>

        <div class="form-row">

          <div class="form-group">

            <label>
              الإجابة الصحيحة
            </label>

            <select
              id="correctAnswer"
              class="form-control"
            >

              <option value="A">A</option>
              <option value="B">B</option>
              <option value="C">C</option>
              <option value="D">D</option>

            </select>

          </div>

          <div class="form-group">

            <label>
              ترتيب السؤال
            </label>

            <input
              id="questionOrder"
              class="form-control"
              type="number"
              value="0"
            >

          </div>

        </div>

        <div class="form-group">

          <label>
            شرح الإجابة
          </label>

          <textarea
            id="questionExplanation"
            class="form-control"
            placeholder="اكتب شرح الإجابة..."
          ></textarea>

        </div>

        <div class="button-row">

          <button
            class="btn btn-success"
            onclick="addQuestion()"
          >
            حفظ السؤال
          </button>

          <button
            class="btn btn-light"
            onclick="hideAddQuestionForm()"
          >
            إلغاء
          </button>

        </div>

      </div>

    `;

  }


  function hideAddQuestionForm() {

    const container =
      document.getElementById(
        "addQuestionContainer"
      );

    if (container) {
      container.classList.add("hidden");
    }

  }


  /* =====================================================
     ADD QUESTION
  ===================================================== */

  async function addQuestion() {

    const questionText =
      document
        .getElementById("questionText")
        .value
        .trim();

    const optionA =
      document
        .getElementById("optionA")
        .value
        .trim();

    const optionB =
      document
        .getElementById("optionB")
        .value
        .trim();

    const optionC =
      document
        .getElementById("optionC")
        .value
        .trim();

    const optionD =
      document
        .getElementById("optionD")
        .value
        .trim();

    const correctAnswer =
      document
        .getElementById("correctAnswer")
        .value;

    const explanation =
      document
        .getElementById("questionExplanation")
        .value
        .trim();

    const questionOrder =
      Number(
        document
          .getElementById("questionOrder")
          .value
      ) || 0;

    if (
      !questionText ||
      !optionA ||
      !optionB ||
      !optionC ||
      !optionD
    ) {

      showError(
        "يجب ملء جميع بيانات السؤال."
      );

      return;

    }

    try {

      await api(
        `/api/admin/quizzes/${currentQuiz.id}/questions`,
        {
          method: "POST",

          body:
            JSON.stringify({

              question_text:
                questionText,

              option_a:
                optionA,

              option_b:
                optionB,

              option_c:
                optionC,

              option_d:
                optionD,

              correct_answer:
                correctAnswer,

              explanation:
                explanation || null,

              question_order:
                questionOrder

            })
        }
      );

      showSuccess(
        "تمت إضافة السؤال بنجاح."
      );

      await loadQuizManagement();

    } catch (error) {

      showError(
        error.message
      );

    }

  }


  /* =====================================================
     DELETE QUESTION
  ===================================================== */

  async function deleteQuestion(
    questionId
  ) {

    const confirmed =
      confirm(
        "هل أنت متأكد من حذف هذا السؤال؟"
      );

    if (!confirmed) {
      return;
    }

    try {

      await api(
        `/api/admin/quizzes/questions/${questionId}`,
        {
          method: "DELETE"
        }
      );

      showSuccess(
        "تم حذف السؤال."
      );

      await loadQuizManagement();

    } catch (error) {

      showError(
        error.message
      );

    }

  }


  /* =====================================================
     USERS
  ===================================================== */

  async function showUsers() {

    currentSubject = null;
    currentUnit = null;
    currentLesson = null;
    currentQuiz = null;

    renderSubjects();

    document
      .getElementById("pageTitle")
      .textContent =
        "المستخدمون";

    document
      .getElementById("pageSubtitle")
      .textContent =
        "إدارة حسابات الطلاب.";

    document
      .getElementById("breadcrumb")
      .innerHTML =
        "الرئيسية ← <span>المستخدمون</span>";

    const area =
      document.getElementById(
        "contentArea"
      );

    area.innerHTML = `
      <div class="card">

        <div class="loading">

          <div class="spinner"></div>

          جاري تحميل المستخدمين...

        </div>

      </div>
    `;

    try {

      const data =
        await api(
          "/api/admin/users"
        );

      const users =
        Array.isArray(data.users)
          ? data.users
          : [];

      renderUsers(users);

    } catch (error) {

      area.innerHTML = `
        <div class="card">
          <div class="empty">
            تعذر تحميل المستخدمين.
            <br><br>
            ${escapeHtml(
              error.message
            )}
          </div>
        </div>
      `;

    }

  }


  /* =====================================================
     RENDER USERS
  ===================================================== */

  function renderUsers(
    users
  ) {

    const area =
      document.getElementById(
        "contentArea"
      );

    if (!users.length) {

      area.innerHTML = `
        <div class="card">
          <div class="empty">
            لا يوجد مستخدمون حتى الآن.
          </div>
        </div>
      `;

      return;

    }

    let rows = "";

    users.forEach(
      user => {

        rows += `

          <tr>

            <td>
              ${escapeHtml(user.id)}
            </td>

            <td>
              ${escapeHtml(user.name)}
            </td>

            <td>
              ${escapeHtml(user.email)}
            </td>

            <td>
              ${escapeHtml(user.grade)}
            </td>

            <td>
              ${user.created_at
                ? new Date(
                    user.created_at
                  ).toLocaleDateString("ar")
                : "-"
              }
            </td>

            <td>

              <div
                class="button-row"
                style="margin-top:0;"
              >

                <button
                  class="btn btn-warning"
                  onclick="resetUserPassword(${user.id})"
                >
                  تغيير كلمة المرور
                </button>

                <button
                  class="btn btn-danger"
                  onclick="deleteUser(${user.id})"
                >
                  حذف
                </button>

              </div>

            </td>

          </tr>

        `;

      }
    );

    area.innerHTML = `

      <div class="card">

        <div class="card-title">
          المستخدمون
        </div>

        <div class="table-wrapper">

          <table>

            <thead>

              <tr>

                <th>ID</th>
                <th>الاسم</th>
                <th>البريد</th>
                <th>الصف</th>
                <th>تاريخ التسجيل</th>
                <th>الإجراءات</th>

              </tr>

            </thead>

            <tbody>
              ${rows}
            </tbody>

          </table>

        </div>

      </div>

    `;

  }


  /* =====================================================
     RESET USER PASSWORD
  ===================================================== */

  async function resetUserPassword(
    userId
  ) {

    const newPassword =
      prompt(
        "اكتب كلمة المرور الجديدة:"
      );

    if (newPassword === null) {
      return;
    }

    if (newPassword.length < 6) {

      showError(
        "كلمة المرور يجب أن تكون 6 أحرف على الأقل."
      );

      return;

    }

    try {

      await api(
        `/api/admin/users/${userId}/reset-password`,
        {
          method: "POST",

          body:
            JSON.stringify({
              newPassword
            })
        }
      );

      showSuccess(
        "تم تغيير كلمة المرور بنجاح."
      );

    } catch (error) {

      showError(
        error.message
      );

    }

  }


  /* =====================================================
     DELETE USER
  ===================================================== */

  async function deleteUser(
    userId
  ) {

    const confirmed =
      confirm(
        "هل أنت متأكد من حذف هذا المستخدم؟ سيتم حذف بيانات اختباراته أيضًا."
      );

    if (!confirmed) {
      return;
    }

    try {

      await api(
        `/api/admin/users/${userId}`,
        {
          method: "DELETE"
        }
      );

      showSuccess(
        "تم حذف المستخدم بنجاح."
      );

      await showUsers();

    } catch (error) {

      showError(
        error.message
      );

    }

  }


  /* =====================================================
     INITIALIZATION
  ===================================================== */

  document.addEventListener(
    "DOMContentLoaded",
    function() {

      if (adminToken) {
        showAdminScreen();
      }

    }
  );

</script>
